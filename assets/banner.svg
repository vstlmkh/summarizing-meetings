    <rect x="72" y="150" width="140" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="204" font-size="22" fill="#cbd5e1">Raw call transcript → clean record → follow-up with action items</text>
    <text x="72" y="248" font-size="20" fill="#64748b">Agent skill · three gated stages · every claim grounded in a quote</text>
  </g>

